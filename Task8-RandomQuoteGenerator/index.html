<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern random quote generator built with HTML, CSS and JavaScript.">
    <title>Random Quote Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="quote-card">

            <div class="badge">✦ DAILY INSPIRATION</div>

            <div class="quote-mark">“</div>

            <p id="quote" class="quote">
                Click the button below to discover an inspiring quote.
            </p>

            <p id="author" class="author">
                — Random Quote Generator
            </p>

            <div class="divider"></div>

            <div class="actions">

                <button id="newQuoteBtn" class="primary-btn">
                    <span>↻</span> New Quote
                </button>

                <button id="shareBtn" class="secondary-btn">
                    <span>↗</span> Share
                </button>

            </div>

            <p id="status" class="status" aria-live="polite"></p>

        </section>

        <footer>
            <p>Built with HTML5 • CSS3 • JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>

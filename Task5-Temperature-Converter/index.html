<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="converter-card">

            <h1>Temperature Converter</h1>
            <p class="subtitle">Convert temperatures between Celsius, Fahrenheit and Kelvin</p>

            <div class="input-group">
                <label for="celsius">Celsius (°C)</label>
                <input type="number" id="celsius" placeholder="Enter Celsius" step="any">
            </div>

            <div class="input-group">
                <label for="fahrenheit">Fahrenheit (°F)</label>
                <input type="number" id="fahrenheit" placeholder="Enter Fahrenheit" step="any">
            </div>

            <div class="input-group">
                <label for="kelvin">Kelvin (K)</label>
                <input type="number" id="kelvin" placeholder="Enter Kelvin" step="any">
            </div>

            <p id="error-message"></p>

            <button id="clear-btn">Clear All</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="converter-card">

            <!-- Header -->
            <div class="header">

                <div class="icon">💱</div>

                <h1>Currency Converter</h1>

                <p>
                    Convert currencies using live exchange rates.
                </p>

            </div>


            <!-- Amount -->
            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0"
                    step="any"
                    value="1"
                >

            </div>


            <!-- Currency Selection -->
            <div class="currency-section">

                <!-- From Currency -->
                <div class="currency-box">

                    <label for="fromCurrency">
                        From
                    </label>

                    <select id="fromCurrency">

                        <option>
                            Loading...
                        </option>

                    </select>

                </div>


                <!-- Swap Button -->
                <button
                    id="swapButton"
                    class="swap-button"
                    title="Swap currencies"
                >
                    ⇄
                </button>


                <!-- To Currency -->
                <div class="currency-box">

                    <label for="toCurrency">
                        To
                    </label>

                    <select id="toCurrency">

                        <option>
                            Loading...
                        </option>

                    </select>

                </div>

            </div>


            <!-- Convert Button -->
            <button
                id="convertButton"
                class="convert-button"
            >
                Convert
            </button>


            <!-- Loading Message -->
            <div
                id="loading"
                class="loading hidden"
            >
                Loading exchange rates...
            </div>


            <!-- Error Message -->
            <div
                id="errorMessage"
                class="error hidden"
            >
            </div>


            <!-- Result -->
            <div
                id="result"
                class="result"
            >

                <p class="result-label">
                    Converted Amount
                </p>

                <h2 id="resultText">
                    Enter an amount and click Convert
                </h2>

                <p
                    id="rateText"
                    class="rate-text"
                >
                </p>

            </div>


            <!-- Last Updated -->
            <p
                id="updatedText"
                class="updated-text"
            >
            </p>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>

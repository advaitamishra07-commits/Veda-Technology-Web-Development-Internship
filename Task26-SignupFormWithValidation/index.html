
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive signup form with real-time validation.">
    <title>Create Account | SignUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="signup-card">
            <div class="brand-icon">✦</div>

            <h1>Create Account</h1>
            <p class="subtitle">Join us today. It only takes a minute.</p>

            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        aria-describedby="nameError"
                    >
                    <small class="error" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        aria-describedby="emailError"
                    >
                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        aria-describedby="passwordError strengthText"
                    >

                    <div class="strength-track">
                        <div id="strengthBar"></div>
                    </div>
                    <small id="strengthText" class="strength-text">
                        Password strength: Not entered
                    </small>
                    <small class="error" id="passwordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        aria-describedby="confirmError"
                    >
                    <small class="error" id="confirmError"></small>
                </div>

                <button type="submit" id="submitBtn">
                    Create Account <span aria-hidden="true">→</span>
                </button>

                <p id="successMessage" class="success" role="status"
                   aria-live="polite"></p>
            </form>

            <p class="footer-text">Built with HTML, CSS &amp; JavaScript</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Pricing Table</h1>

    <div class="pricing">

        <!-- Basic Plan -->
        <div class="card">
            <h2>Basic</h2>
            <h3>₹199/month</h3>

            <p>✓ 5 Projects</p>
            <p>✓ 10 GB Storage</p>
            <p>✓ Basic Support</p>

            <button onclick="alert('Basic plan selected!')">
                Get Started
            </button>
        </div>

        <!-- Pro Plan -->
        <div class="card popular">
            <h2>Pro</h2>
            <h3>₹499/month</h3>

            <p>✓ 20 Projects</p>
            <p>✓ 50 GB Storage</p>
            <p>✓ Priority Support</p>

            <button onclick="alert('Pro plan selected!')">
                Choose Pro
            </button>
        </div>

        <!-- Premium Plan -->
        <div class="card">
            <h2>Premium</h2>
            <h3>₹999/month</h3>

            <p>✓ Unlimited Projects</p>
            <p>✓ 200 GB Storage</p>
            <p>✓ 24/7 Support</p>

            <button onclick="alert('Premium plan selected!')">
                Go Premium
            </button>
        </div>

    </div>

</body>
</html>
